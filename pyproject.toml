[project]
name = "dune1"
version = "0.1.0"
description = "Minimal proxy-bound DuneSQL CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.28,<0.29",
]

[project.scripts]
dune1 = "dune1.cli:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv_build]
packages = ["src/dune1"]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["dune1"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
